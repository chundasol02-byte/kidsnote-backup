# Kidsnote → Notion mirror (태민 & 태강 분리 저장)
#
# 동작:
# - 태민(ID: 5305112) -> NOTION_DATABASE_ID 로 백업
# - 태강(ID: 5305117) -> NOTION_DATABASE_ID_2 로 백업
# - Kidsnote 알림장 원문 및 사진을 Notion에 백업
# - AI 기능 및 Ollama 비활성화
#
# Required GitHub repository secrets:
#   KIDSNOTE_ID
#   KIDSNOTE_PASSWORD
#   NOTION_TOKEN
#   NOTION_DATABASE_ID       (태민 DB)
#   NOTION_DATABASE_ID_2     (태강 DB)

name: Kidsnote → Notion mirror

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "최근 N개 알림장만 백업 (전체 백업이면 비워두세요)"
        required: false
        default: ""

      monthly_sample:
        description: "테스트 모드 — 매월 알림장 1개씩만 처리"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

      target_child:
        description: "백업 대상 선택"
        required: true
        default: "ALL"
        type: choice
        options:
          - "ALL (태민 + 태강 둘 다)"
          - "태민 (5305112)"
          - "태강 (5305117)"

  schedule:
    # 매주 일요일 오전 3시 15분 (한국 시간 기준) -> UTC 토요일 18:15
    - cron: "15 18 * * 6"

permissions:
  contents: read

concurrency:
  group: kidsnote-to-notion
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f tools/kidsnote_fetch/requirements.txt ]; then
            pip install -r tools/kidsnote_fetch/requirements.txt
          fi
          pip install pillow piexif playwright

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          python -m playwright install --with-deps chromium

      - name: Verify required secrets
        env:
          KIDSNOTE_ID: ${{ secrets.KIDSNOTE_ID }}
          KIDSNOTE_PASSWORD: ${{ secrets.KIDSNOTE_PASSWORD }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_ID_2: ${{ secrets.NOTION_DATABASE_ID_2 }}
        run: |
          set -euo pipefail
          MISSING_SECRET=false

          for secret_name in KIDSNOTE_ID KIDSNOTE_PASSWORD NOTION_TOKEN NOTION_DATABASE_ID NOTION_DATABASE_ID_2; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Repository secret '${secret_name}' is empty or unset"
              MISSING_SECRET=true
            fi
          done

          if [ "${MISSING_SECRET}" = "true" ]; then
            exit 1
          fi

      - name: Login to Kidsnote via Playwright
        env:
          KIDSNOTE_ID: ${{ secrets.KIDSNOTE_ID }}
          KIDSNOTE_PASSWORD: ${{ secrets.KIDSNOTE_PASSWORD }}
        run: |
          set -euo pipefail
          python tools/kidsnote_fetch/login_playwright.py

      - name: Mirror Kidsnote → Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID_TAEMIN: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_ID_TAEGANG: ${{ secrets.NOTION_DATABASE_ID_2 }}
          PYTHONUNBUFFERED: "1"

          # 수동 실행 옵션
          TARGET_CHILD: ${{ github.event_name == 'workflow_dispatch' && inputs.target_child || 'ALL (태민 + 태강 둘 다)' }}
          RUN_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
          MONTHLY_SAMPLE: ${{ github.event_name == 'workflow_dispatch' && inputs.monthly_sample == 'true' && 'true' || 'false' }}

          # AI 기능 전체 강제 비활성화
          DISABLE_ALL_LLM: "true"
          DISABLE_GROWTH_STORY: "true"
          DISABLE_MILESTONES: "true"
          DISABLE_INTERESTS: "true"
          DISABLE_TEACHER_THANKS: "true"

        run: |
          set -euo pipefail

          COMMON_ARGS=(
            "--auth-mode" "session-cookie-env"
            "--publish-to-notion"
            "--no-local-save"
          )

          if [ -n "${RUN_LIMIT}" ]; then
            COMMON_ARGS+=("--limit" "${RUN_LIMIT}")
          fi

          if [ "${MONTHLY_SAMPLE}" = "true" ]; then
            COMMON_ARGS+=("--monthly-sample")
          fi

          # 1. 태민 백업 (ID: 5305112)
          if [[ "${TARGET_CHILD}" == *"ALL"* || "${TARGET_CHILD}" == *"태민"* ]]; then
            echo "============================================"
            echo "Kidsnote → Notion 백업 시작: 태민 (ID: 5305112)"
            echo "============================================"
            export NOTION_DATABASE_ID="${NOTION_DATABASE_ID_TAEMIN}"
            python tools/kidsnote_fetch/fetch.py "${COMMON_ARGS[@]}" --child-id "5305112"
          fi

          # 2. 태강 백업 (ID: 5305117)
          if [[ "${TARGET_CHILD}" == *"ALL"* || "${TARGET_CHILD}" == *"태강"* ]]; then
            echo "============================================"
            echo "Kidsnote → Notion 백업 시작: 태강 (ID: 5305117)"
            echo "============================================"
            export NOTION_DATABASE_ID="${NOTION_DATABASE_ID_TAEGANG}"
            python tools/kidsnote_fetch/fetch.py "${COMMON_ARGS[@]}" --child-id "5305117"
          fi

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kidsnote-backup-failure-logs
          path: |
            /tmp/ollama.log
            tools/kidsnote_fetch/*.log
            tools/kidsnote_fetch/**/*.log
          if-no-files-found: ignore
          retention-days: 7
